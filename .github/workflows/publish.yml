name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src test

      - name: Lint
        run: python -m ruff check src test

      - name: Type-check
        run: python -m mypy

      - name: Run tests with coverage
        run: python -m pytest -q --cov=aspose_pdf_cloud_mcp --cov-report=term-missing

      - name: Audit runtime dependencies
        run: python -m pip_audit .

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          actual="$(python -c 'from importlib.metadata import version; print(version("aspose-pdf-cloud-mcp"))')"
          test "$actual" = "$expected"

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/aspose-pdf-cloud-cli --help
          .wheel-smoke/bin/apdf --help
          .wheel-smoke/bin/python -c "from aspose_pdf_cloud_mcp import mcp_server; print(mcp_server.mcp.name)"
          .wheel-smoke/bin/aspose-pdf-cloud-cli skill install codex --target-dir .wheel-smoke/skills
          test -f .wheel-smoke/skills/aspose-pdf-cloud-mcp/SKILL.md

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

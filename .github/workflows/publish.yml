name: Publish to PyPI

on:
  push:
    tags: ['v*']
  # Select an existing vX.Y.Z tag to rehearse on TestPyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified distributions
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/project/aspose-pdf-cloud-mcp/' || 'https://pypi.org/project/aspose-pdf-cloud-mcp/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Require a stable release version matching the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_distribution.py dist --release-tag "$RELEASE_TAG"
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

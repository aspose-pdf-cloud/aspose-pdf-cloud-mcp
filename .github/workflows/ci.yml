name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest -q --cov=aspose_pdf_cloud_mcp --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check src test
      - name: Lint
        run: python -m ruff check src test
      - name: Type-check
        run: python -m mypy
      - name: Audit runtime dependencies
        run: python -m pip_audit .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/aspose-pdf-cloud-cli --help
          .wheel-smoke/bin/apdf --help
          .wheel-smoke/bin/python -c "from aspose_pdf_cloud_mcp import mcp_server; print(mcp_server.mcp.name)"
          .wheel-smoke/bin/aspose-pdf-cloud-cli skill install codex --target-dir .wheel-smoke/skills
          test -f .wheel-smoke/skills/aspose-pdf-cloud-mcp/SKILL.md

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --no-progress
            --exclude-mail
            './**/*.md'
          fail: true

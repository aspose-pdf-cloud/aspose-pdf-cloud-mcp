name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit tests and coverage
        run: python -m pytest -q -m 'not live' --cov=aspose_pdf_cloud_mcp --cov-report=term-missing

  distributions:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install build 'twine>=6.1'
      - name: Clean stale build artifacts
        run: rm -rf dist build *.egg-info
      - name: Build sdist and wheel from sdist
        run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/apdf-wheel
          /tmp/apdf-wheel/bin/python -m pip install dist/*.whl
          /tmp/apdf-wheel/bin/python scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error


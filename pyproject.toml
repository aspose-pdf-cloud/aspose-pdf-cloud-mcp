[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=9.2,<11",
]
build-backend = "setuptools.build_meta"

[project]
name = "aspose-pdf-cloud-mcp"
dynamic = ["version"]
description = "CLI and MCP server tools for Aspose PDF Cloud"
authors = [
    {name = "Aspose.PDF Team",email = "pdf@aspose.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["aspose", "pdf", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "asposepdfcloud>=26.4.0,<27.0.0",
    "mcp>=2.0.0,<3.0.0",
    "rich>=13.0.0",
    "typing-extensions>=4.13.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.17.0",
    "pip-audit>=2.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.12.0",
    "twine>=5.0.0",
]

[project.scripts]
aspose-pdf-cloud-cli = "aspose_pdf_cloud_mcp.cli:main"
apdf = "aspose_pdf_cloud_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/aspose-pdf-cloud/aspose-pdf-cloud-mcp"
Repository = "https://github.com/aspose-pdf-cloud/aspose-pdf-cloud-mcp"
Issues = "https://github.com/aspose-pdf-cloud/aspose-pdf-cloud-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aspose_pdf_cloud_mcp = [
    "py.typed",
    "resources/skills/*/SKILL.md",
    "resources/skills/*/agents/*.yaml",
    "resources/skills/*/references/*.md",
]

[tool.setuptools_scm]
version_file = "src/aspose_pdf_cloud_mcp/_version.py"
write_to_source = true

[tool.pytest.ini_options]
markers = [
    "live: tests that call the real Aspose.PDF Cloud API when credentials are present",
]

[tool.coverage.run]
branch = true
source = ["aspose_pdf_cloud_mcp"]
omit = ["*/_version.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src/aspose_pdf_cloud_mcp"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["asposepdfcloud", "asposepdfcloud.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/aspose_pdf_cloud_mcp/_version.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
